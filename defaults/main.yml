---
# defaults/main.yml — stratum_factory.emergency_user
#
# All inputs are supplied by the wrapper. No hardcoded secrets.

# --- Emergency last-resort console user -----------------------------------------
# A password-based account for use via the GCP serial console when SSH/VPN/network
# access is broken. sshd PasswordAuthentication stays disabled — this account is
# explicitly NOT an SSH login path. Sudo requires the password (no NOPASSWD).
#
# Password must be supplied as a pre-hashed SHA-512 crypt string
# (e.g. generated by: openssl passwd -6 -stdin).
# Never commit plaintext passwords.

emergency_user_name: stratum-rescue
emergency_user_password_hash: ""  # pre-hashed SHA-512 — REQUIRED (validated in tasks)
emergency_user_shell: /bin/bash
emergency_user_sudo: true
